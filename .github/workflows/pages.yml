name: 发布博客到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取博客与主题
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 生成博客
        run: npm run build
      - name: 上传网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
